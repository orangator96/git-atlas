[workspace]
members = [
    "server",
    "ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["git-atlas contributors"]
license = "MIT"

# Release profile applies to all workspace members
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40.0", features = ["full"] }

# HTTP server
axum = { version = "0.7.7", features = ["ws"] }
tower = { version = "0.5.1" }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128" }

# Git
# vendored-libgit2: statically link libgit2 for portability
# ssh feature disabled: not needed for a read-only viewer, avoids openssl-sys dep
git2 = { version = "0.19.0", default-features = false, features = ["vendored-libgit2"] }

# Full-text search
tantivy = { version = "0.22.0" }

# Error handling
anyhow = { version = "1.0.89" }
thiserror = { version = "1.0.64" }

# Logging / tracing
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Config & secrets
config = { version = "0.15.26" }
keyring = { version = "3.3.0" }

# HTTP client (for forge APIs: Bitbucket, GitHub, GitLab)
# default-features = false disables the default OpenSSL/native-tls backend
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1.10.0", features = ["v4"] }
chrono = { version = "0.4.38", features = ["serde"] }

# Embedded static assets (the built web UI, served by the standalone server)
rust-embed = { version = "8.5.0" }
mime_guess = { version = "2.0.5" }

# Filesystem watching (live updates when the repo's .git changes)
notify = { version = "6.1.1" }
